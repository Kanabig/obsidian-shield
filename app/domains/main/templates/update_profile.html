<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Shield - 회원정보 수정</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 최초 로그인 화면 CSS 그대로 사용 -->
    <link rel="stylesheet" href="{{ url_for('main.static', filename='css/first_login_form.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
</head>

<body>

    {% include "includes/header.html" %}

    <main class="main-container">

        <section class="setup-card">

            <div class="top-icon">
                <i class="fa-solid fa-user-gear"></i>
            </div>

            <div class="title-section">
                <h2>회원정보 수정</h2>
                <p>현재 비밀번호를 입력한 후 새 비밀번호를 설정하세요.</p>
            </div>

            <form id="passwordForm"
                  class="setup-form"
                  action="/change_password"
                  method="POST">

                <!-- 현재 비밀번호 -->
                <div class="input-group">
                    <label>
                        <i class="fa-solid fa-lock"></i>
                        현재 비밀번호
                    </label>

                    <div class="input-wrapper">
                        <input
                            type="password"
                            name="oPw"
                            id="oPw"
                            placeholder="현재 비밀번호를 입력하세요">

                        <button type="button" class="toggle-password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 새 비밀번호 -->
                <div class="input-group">
                    <label>
                        <i class="fa-solid fa-lock"></i>
                        새 비밀번호
                    </label>

                    <div class="input-wrapper">
                        <input
                            type="password"
                            name="nPw"
                            id="nPw"
                            placeholder="새 비밀번호를 입력하세요">

                        <button type="button" class="toggle-password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 새 비밀번호 확인 -->
                <div class="input-group">
                    <label>
                        <i class="fa-solid fa-lock"></i>
                        새 비밀번호 확인
                    </label>

                    <div class="input-wrapper">
                        <input
                            type="password"
                            name="nPwCheck"
                            id="nPwCheck"
                            placeholder="새 비밀번호를 다시 입력하세요">

                        <button type="button" class="toggle-password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- 안내 -->
                <div class="info-box">
                    <h3>
                        <i class="fa-solid fa-circle-info"></i>
                        비밀번호 설정 안내
                    </h3>

                    <ul>
                        <li>8자 이상 16자 이하로 입력하세요.</li>
                        <li>영문, 숫자, 특수문자 중 2가지 이상을 포함하세요.</li>
                        <li>현재 비밀번호와 동일한 비밀번호는 사용할 수 없습니다.</li>
                    </ul>
                </div>

                <!-- 로그인 화면과 동일한 메시지 박스 -->
                {% include "includes/message_box.html" %}

                <button
                    type="button"
                    class="submit-btn"
                    onclick="change_password()">

                    <i class="fa-solid fa-user-pen"></i>
                    회원정보 변경요청

                </button>

            </form>

        </section>

    </main>

    <script>

        function change_password() {

            const form = document.getElementById("passwordForm");
            form.submit();

        }

    </script>

</body>
</html>
